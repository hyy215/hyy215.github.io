<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
  <title id="title">ART 自动推理与工具使用流程</title>
  <desc id="desc">新任务先从任务库选择相关示例并构造提示，冻结的语言模型生成结构化推理程序。解析器遇到工具调用时暂停生成，执行工具并把结果写回上下文；没有工具调用时输出答案。人工可以修正任务库示例或补充工具。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.10"/>
    </filter>
    <style>
      text {
        font-family: Inter, "PingFang SC", "Microsoft YaHei", Arial, sans-serif;
        fill: #172033;
      }
      .heading { font-size: 34px; font-weight: 700; }
      .subtitle { font-size: 19px; fill: #64748b; }
      .node-title { font-size: 23px; font-weight: 700; }
      .node-note { font-size: 17px; fill: #475569; }
      .edge-label { font-size: 17px; font-weight: 600; fill: #475569; }
      .legend { font-size: 17px; fill: #475569; }
      .arrow {
        fill: none;
        stroke: #475569;
        stroke-width: 4;
        marker-end: url(#arrow);
      }
      .loop {
        fill: none;
        stroke: #2563eb;
        stroke-width: 4;
        stroke-dasharray: 10 8;
        marker-end: url(#arrow-blue);
      }
      .feedback {
        fill: none;
        stroke: #7c3aed;
        stroke-width: 4;
        stroke-dasharray: 8 8;
        marker-end: url(#arrow);
      }
    </style>
  </defs>

  <rect width="1440" height="760" rx="28" fill="#f8fafc"/>
  <text x="60" y="68" class="heading">ART：从跨任务示例到推理程序与工具执行</text>
  <text x="60" y="105" class="subtitle">应用负责选择示例、解析程序和执行工具；冻结的 LLM 根据工具结果继续生成后续步骤。</text>

  <!-- Main flow -->
  <g filter="url(#shadow)">
    <rect x="45" y="190" width="175" height="115" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="3"/>
  </g>
  <text x="132.5" y="237" text-anchor="middle" class="node-title">新任务</text>
  <text x="132.5" y="272" text-anchor="middle" class="node-note">任务描述与输入</text>

  <g filter="url(#shadow)">
    <rect x="270" y="160" width="220" height="175" rx="20" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="3"/>
  </g>
  <text x="380" y="205" text-anchor="middle" class="node-title">Task Library</text>
  <text x="380" y="240" text-anchor="middle" class="node-note">相关任务的推理程序</text>
  <text x="380" y="272" text-anchor="middle" class="node-note">工具调用示例</text>
  <text x="380" y="304" text-anchor="middle" class="node-note">跨任务选择</text>

  <g filter="url(#shadow)">
    <rect x="540" y="190" width="210" height="115" rx="20" fill="#dbeafe" stroke="#3b82f6" stroke-width="3"/>
  </g>
  <text x="645" y="237" text-anchor="middle" class="node-title">构造 Prompt</text>
  <text x="645" y="272" text-anchor="middle" class="node-note">任务 + 相关示例</text>

  <g filter="url(#shadow)">
    <rect x="800" y="190" width="210" height="115" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  </g>
  <text x="905" y="237" text-anchor="middle" class="node-title">Frozen LLM</text>
  <text x="905" y="272" text-anchor="middle" class="node-note">生成推理程序</text>

  <g filter="url(#shadow)">
    <rect x="1060" y="175" width="235" height="145" rx="20" fill="#fff7ed" stroke="#f97316" stroke-width="3"/>
  </g>
  <text x="1177.5" y="220" text-anchor="middle" class="node-title">PeG 解析器</text>
  <text x="1177.5" y="255" text-anchor="middle" class="node-note">识别 Q / # 步骤</text>
  <text x="1177.5" y="287" text-anchor="middle" class="node-note">检测工具调用与结束标记</text>

  <path class="arrow" d="M220 247.5 H270"/>
  <path class="arrow" d="M490 247.5 H540"/>
  <path class="arrow" d="M750 247.5 H800"/>
  <path class="arrow" d="M1010 247.5 H1060"/>

  <!-- Decision and tool loop -->
  <polygon points="1177.5,385 1270,445 1177.5,505 1085,445" fill="#ffffff" stroke="#64748b" stroke-width="3" filter="url(#shadow)"/>
  <text x="1177.5" y="438" text-anchor="middle" class="node-title">需要工具？</text>
  <text x="1177.5" y="470" text-anchor="middle" class="node-note">或已经结束</text>
  <path class="arrow" d="M1177.5 320 V385"/>

  <g filter="url(#shadow)">
    <rect x="760" y="405" width="245" height="115" rx="20" fill="#ffedd5" stroke="#f97316" stroke-width="3"/>
  </g>
  <text x="882.5" y="452" text-anchor="middle" class="node-title">Tool Executor</text>
  <text x="882.5" y="487" text-anchor="middle" class="node-note">搜索 / 代码执行</text>

  <path class="arrow" d="M1085 445 H1005"/>
  <text x="1045" y="425" text-anchor="middle" class="edge-label">是</text>
  <path class="loop" d="M882.5 405 V350 H905 V307"/>
  <text x="768" y="365" class="edge-label">结果写回上下文后继续生成</text>

  <g filter="url(#shadow)">
    <rect x="1090" y="575" width="175" height="105" rx="20" fill="#dcfce7" stroke="#22c55e" stroke-width="3"/>
  </g>
  <text x="1177.5" y="620" text-anchor="middle" class="node-title">最终答案</text>
  <text x="1177.5" y="654" text-anchor="middle" class="node-note">Ans</text>
  <path class="arrow" d="M1177.5 505 V575"/>
  <text x="1198" y="552" class="edge-label">结束</text>

  <!-- Optional human feedback -->
  <g filter="url(#shadow)">
    <rect x="120" y="485" width="305" height="120" rx="20" fill="#ede9fe" stroke="#8b5cf6" stroke-width="3"/>
  </g>
  <text x="272.5" y="530" text-anchor="middle" class="node-title">可选人工修正</text>
  <text x="272.5" y="565" text-anchor="middle" class="node-note">修正示例程序 / 增加工具</text>
  <path class="feedback" d="M272.5 485 V405 H380 V337"/>
  <text x="292" y="390" class="edge-label" fill="#7c3aed">更新任务库</text>

  <!-- Legend -->
  <g transform="translate(60 715)">
    <rect x="0" y="-19" width="28" height="28" rx="6" fill="#f3e8ff" stroke="#8b5cf6" stroke-width="2"/>
    <text x="42" y="2" class="legend">任务库与人工反馈</text>

    <rect x="245" y="-19" width="28" height="28" rx="6" fill="#dcfce7" stroke="#22c55e" stroke-width="2"/>
    <text x="287" y="2" class="legend">模型与最终输出</text>

    <rect x="490" y="-19" width="28" height="28" rx="6" fill="#ffedd5" stroke="#f97316" stroke-width="2"/>
    <text x="532" y="2" class="legend">程序解析与工具执行</text>

    <line x1="780" y1="-5" x2="830" y2="-5" stroke="#2563eb" stroke-width="4" stroke-dasharray="10 8"/>
    <text x="845" y="2" class="legend">工具结果回填循环</text>
  </g>
</svg>
