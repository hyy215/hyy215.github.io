<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1180" viewBox="0 0 900 1180" role="img" aria-labelledby="title desc">
  <title id="title">浏览器事件循环与渲染任务的简化关系</title>
  <desc id="desc">事件循环从任务队列中选择并执行一个可运行任务，随后执行微任务检查点并进入下一轮。窗口事件循环同时等待渲染机会；出现机会后，浏览器把更新页面的工作排入渲染任务源，等待事件循环选择。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#3569a8"/>
    </marker>
    <marker id="render-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10z" fill="#36805d"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; fill: #172033; }
      .title { font-size: 38px; font-weight: 700; }
      .heading { font-size: 25px; font-weight: 650; }
      .body { font-size: 20px; }
      .small { font-size: 18px; fill: #5f6b7a; }
      .queue { fill: #fff8ef; stroke: #e4a455; stroke-width: 2.5; }
      .task { fill: #f7faff; stroke: #79a5d8; stroke-width: 3; }
      .microtask { fill: #faf7ff; stroke: #9b7bd2; stroke-width: 3; }
      .render { fill: #f2fbf7; stroke: #57a982; stroke-width: 3; }
      .next { fill: #f4f6f8; stroke: #8d99a8; stroke-width: 3; }
      .chip { fill: #fff; stroke-width: 2; }
      .flow { fill: none; stroke: #3569a8; stroke-width: 4; marker-end: url(#arrow); }
      .render-flow { fill: none; stroke: #36805d; stroke-width: 4; marker-end: url(#render-arrow); }
      .number { fill: #3569a8; font-size: 24px; font-weight: 700; }
    </style>
  </defs>

  <text x="450" y="55" text-anchor="middle" class="title">浏览器事件循环与渲染任务（简化）</text>
  <text x="450" y="92" text-anchor="middle" class="small">任务处理循环与渲染机会相互配合</text>

  <rect x="55" y="125" width="790" height="150" rx="24" class="queue"/>
  <text x="450" y="163" text-anchor="middle" class="heading">一个或多个任务队列（示意）</text>
  <rect x="78" y="190" width="170" height="50" rx="14" class="chip" stroke="#dfb982"/>
  <rect x="270" y="190" width="170" height="50" rx="14" class="chip" stroke="#dfb982"/>
  <rect x="462" y="190" width="170" height="50" rx="14" class="chip" stroke="#dfb982"/>
  <rect x="654" y="190" width="170" height="50" rx="14" class="chip" stroke="#75a88e"/>
  <text x="163" y="222" text-anchor="middle" class="body">计时器任务</text>
  <text x="355" y="222" text-anchor="middle" class="body">用户交互任务</text>
  <text x="547" y="222" text-anchor="middle" class="body">网络等任务</text>
  <text x="739" y="222" text-anchor="middle" class="body">渲染任务</text>

  <path d="M330 275 V320" class="flow"/>

  <rect x="55" y="330" width="550" height="120" rx="22" class="task"/>
  <text x="95" y="375" text-anchor="middle" class="number">1</text>
  <text x="330" y="375" text-anchor="middle" class="heading">选择一个可运行任务</text>
  <text x="330" y="414" text-anchor="middle" class="body">从浏览器选中的任务队列中</text>
  <text x="330" y="441" text-anchor="middle" class="small">取出最早的可运行任务</text>

  <path d="M330 450 V495" class="flow"/>

  <rect x="55" y="505" width="550" height="165" rx="22" class="task"/>
  <text x="95" y="552" text-anchor="middle" class="number">2</text>
  <text x="330" y="552" text-anchor="middle" class="heading">执行该任务</text>
  <text x="330" y="592" text-anchor="middle" class="body">普通任务：运行任务中的步骤</text>
  <text x="330" y="625" text-anchor="middle" class="body">渲染任务：运行 rAF 回调并按需更新页面</text>
  <text x="330" y="652" text-anchor="middle" class="small">Style / Layout / Paint / Raster / Composite 为实现层面的简化</text>

  <path d="M330 670 V715" class="flow"/>

  <rect x="55" y="725" width="550" height="150" rx="22" class="microtask"/>
  <text x="95" y="773" text-anchor="middle" class="number">3</text>
  <text x="330" y="773" text-anchor="middle" class="heading">执行微任务检查点</text>
  <text x="330" y="814" text-anchor="middle" class="body">依次运行微任务；新加入的微任务继续处理</text>
  <text x="330" y="848" text-anchor="middle" class="small">直到微任务队列为空</text>

  <path d="M330 875 V920" class="flow"/>

  <rect x="180" y="930" width="300" height="70" rx="22" class="next"/>
  <text x="330" y="974" text-anchor="middle" class="heading">进入下一轮</text>
  <path d="M180 965 H28 V390 H45" class="flow"/>

  <rect x="650" y="345" width="205" height="115" rx="22" class="render"/>
  <text x="752" y="389" text-anchor="middle" class="heading">并行等待</text>
  <text x="752" y="424" text-anchor="middle" class="body">渲染机会</text>

  <path d="M752 460 V520" class="render-flow"/>

  <rect x="650" y="530" width="205" height="145" rx="22" class="render"/>
  <text x="752" y="574" text-anchor="middle" class="heading">出现机会后</text>
  <text x="752" y="610" text-anchor="middle" class="body">在渲染任务源中</text>
  <text x="752" y="640" text-anchor="middle" class="body">排入更新渲染任务</text>

  <path d="M855 602 H880 V215 H835" class="render-flow"/>

  <rect x="620" y="760" width="250" height="235" rx="22" fill="#f8fafc" stroke="#c3ccd7" stroke-width="2"/>
  <text x="745" y="806" text-anchor="middle" class="heading">渲染可能被跳过</text>
  <text x="745" y="838" text-anchor="middle" class="body">页面不可见</text>
  <text x="745" y="872" text-anchor="middle" class="body">没有可见变化且</text>
  <text x="745" y="906" text-anchor="middle" class="body">没有待执行的 rAF</text>
  <text x="745" y="940" text-anchor="middle" class="body">浏览器主动限流</text>
  <text x="745" y="974" text-anchor="middle" class="small">渲染任务不会保证每轮都出现</text>

  <text x="450" y="1080" text-anchor="middle" class="small">任务源可以映射到一个或多个任务队列；图中分类只用于说明，不代表固定实现。</text>
  <text x="450" y="1112" text-anchor="middle" class="small">每个被选中的任务执行结束后，事件循环都会执行一次微任务检查点。</text>
</svg>
