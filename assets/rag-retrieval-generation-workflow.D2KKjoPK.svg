<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">RAG 离线索引与在线问答流程</title>
  <desc id="desc">离线阶段将文档解析、分块并建立索引；在线阶段根据问题检索、过滤、重排证据，组装上下文并由语言模型生成带引用的答案，证据不足时拒答。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#16835a"/>
    </marker>
    <style>
      .title { font: 700 28px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .lane { font: 700 22px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .box-title { font: 700 18px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #172033; }
      .box-note { font: 15px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526078; }
      .small { font: 600 14px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #526078; }
      .blue-line { stroke: #2563eb; stroke-width: 3; fill: none; marker-end: url(#arrow-blue); }
      .green-line { stroke: #16835a; stroke-width: 3; fill: none; marker-end: url(#arrow-green); }
    </style>
  </defs>

  <rect width="1200" height="650" rx="24" fill="#ffffff"/>
  <text x="600" y="48" text-anchor="middle" class="title">Retrieval-Augmented Generation（RAG）</text>

  <rect x="45" y="82" width="1110" height="214" rx="20" fill="#f2f7ff" stroke="#b8cff7" stroke-width="2"/>
  <text x="75" y="120" class="lane" fill="#1d4ed8">离线索引</text>

  <g>
    <rect x="75" y="150" width="170" height="94" rx="14" fill="#ffffff" stroke="#7aa5ee" stroke-width="2"/>
    <text x="160" y="186" text-anchor="middle" class="box-title">文档与数据</text>
    <text x="160" y="215" text-anchor="middle" class="box-note">手册、网页、数据库</text>

    <path d="M245 197 H285" class="blue-line"/>

    <rect x="286" y="150" width="190" height="94" rx="14" fill="#ffffff" stroke="#7aa5ee" stroke-width="2"/>
    <text x="381" y="186" text-anchor="middle" class="box-title">解析与分块</text>
    <text x="381" y="215" text-anchor="middle" class="box-note">清洗、切分、保留结构</text>

    <path d="M476 197 H516" class="blue-line"/>

    <rect x="517" y="150" width="210" height="94" rx="14" fill="#ffffff" stroke="#7aa5ee" stroke-width="2"/>
    <text x="622" y="186" text-anchor="middle" class="box-title">建立检索表示</text>
    <text x="622" y="215" text-anchor="middle" class="box-note">关键词、向量或混合方式</text>

    <path d="M727 197 H767" class="blue-line"/>

    <rect x="768" y="150" width="310" height="94" rx="14" fill="#e6efff" stroke="#2563eb" stroke-width="2"/>
    <text x="923" y="184" text-anchor="middle" class="box-title">知识索引</text>
    <text x="923" y="211" text-anchor="middle" class="box-note">文本块 + 来源 + 版本 + 权限元数据</text>
  </g>

  <rect x="45" y="325" width="1110" height="272" rx="20" fill="#f1faf6" stroke="#a7dbc5" stroke-width="2"/>
  <text x="75" y="365" class="lane" fill="#11704d">在线问答</text>

  <g>
    <rect x="75" y="408" width="135" height="90" rx="14" fill="#ffffff" stroke="#67b995" stroke-width="2"/>
    <text x="142" y="443" text-anchor="middle" class="box-title">用户问题</text>
    <text x="142" y="470" text-anchor="middle" class="box-note">查询意图</text>

    <path d="M210 453 H245" class="green-line"/>

    <rect x="246" y="408" width="155" height="90" rx="14" fill="#ffffff" stroke="#67b995" stroke-width="2"/>
    <text x="323" y="443" text-anchor="middle" class="box-title">检索候选</text>
    <text x="323" y="470" text-anchor="middle" class="box-note">查找相关文本块</text>

    <path d="M401 453 H436" class="green-line"/>

    <rect x="437" y="408" width="170" height="90" rx="14" fill="#ffffff" stroke="#67b995" stroke-width="2"/>
    <text x="522" y="443" text-anchor="middle" class="box-title">过滤与重排</text>
    <text x="522" y="470" text-anchor="middle" class="box-note">权限、版本、相关性</text>

    <path d="M607 453 H642" class="green-line"/>

    <rect x="643" y="408" width="165" height="90" rx="14" fill="#ffffff" stroke="#67b995" stroke-width="2"/>
    <text x="725" y="443" text-anchor="middle" class="box-title">组装上下文</text>
    <text x="725" y="470" text-anchor="middle" class="box-note">证据与来源加入 Prompt</text>

    <path d="M808 453 H843" class="green-line"/>

    <rect x="844" y="408" width="130" height="90" rx="14" fill="#ffffff" stroke="#67b995" stroke-width="2"/>
    <text x="909" y="443" text-anchor="middle" class="box-title">LLM</text>
    <text x="909" y="470" text-anchor="middle" class="box-note">基于证据生成</text>

    <path d="M974 453 H1009" class="green-line"/>

    <rect x="1010" y="396" width="112" height="114" rx="14" fill="#dff4e9" stroke="#16835a" stroke-width="2"/>
    <text x="1066" y="434" text-anchor="middle" class="box-title">回答</text>
    <text x="1066" y="461" text-anchor="middle" class="box-note">引用证据</text>
    <text x="1066" y="486" text-anchor="middle" class="box-note">或拒答</text>
  </g>

  <path d="M923 244 V275 Q923 310 850 310 H323 Q323 310 323 407" stroke="#2563eb" stroke-width="3" stroke-dasharray="8 7" fill="none" marker-end="url(#arrow-blue)"/>
  <text x="625" y="304" text-anchor="middle" class="small">在线检索读取离线构建的知识索引</text>

  <text x="600" y="629" text-anchor="middle" class="small">数据是否最新、答案是否可靠，取决于索引更新、检索质量、权限控制和生成约束</text>
</svg>
